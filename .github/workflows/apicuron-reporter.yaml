name: Apicuron Reporter

on:
  push:
    branches:
      - main
      - dev
      - debug

jobs:
  report-to-apicuron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Push to APICURON
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Execution mode, 'per-commit' for commit based reporting, 'ett' for ELIXIR Toolkit Theme resources
          MODE: per-commit

          # Dictates which to Apicuron instance send the reports, set to 'dev' for testing instance, 'prod' for production
          APICURON_ENVIRONMENT: dev
          APICURON_TOKEN: ${{ secrets.APICURON_TOKEN }}

          # The unique identifier of the resource in Apicuron
          RESOURCE_ID: disprot

          # An external service that allows to map author usernames to their ORCID iDs.
          # Not needed if you have contributors files with orcids of all contributors
          ORCID_LOOKUP_SERVICE_ENDPOINT:
            ${{ secrets.ORCID_LOOKUP_SERVICE_ENDPOINT }}
          ORCID_LOOKUP_SERVICE_TOKEN: ${{ secrets.ORCID_LOOKUP_SERVICE_TOKEN }}
